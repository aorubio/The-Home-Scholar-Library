  /* CRITICAL: every hidden-toggled overlay/panel on both viewer pages
     (gallery's #zip-progress/#preview-overlay/.gallery-slideshow/
     .slideshow-nav-group, fbundle's .fbundle-author-row/.fbundle-thumbs)
     also sets its own `display:` rule for when it's SHOWN -- which ties
     in specificity with the browser's built-in `[hidden]{display:none}`
     rule, and author CSS loaded after the UA stylesheet wins that tie.
     This is the actual, full explanation for "gallery page opens with
     'Preparing download...' visible": that one rule previously lived
     only in PREVIEW_WIDGET_STYLE (catalog_renderer's node-page template)
     -- it was never in THIS shared style, which is the only stylesheet
     _page_shell()-based pages (gallery, fbundle) actually use, so
     #zip-progress -- `display: flex` + `hidden` in the markup -- was
     visible from first paint on every gallery page the whole time.
     !important beats the tie unconditionally, so this belongs here,
     not just in the module that happened to need it first. */
  [hidden] { display: none !important; }

  :root { --bg: #fdfdfc; --fg: #222; --muted: #666; --card-bg: #f7f7f5; --border: #ddd; --accent: #1a5fb4; }

              cursor: pointer; }

  .thumb-dl.downloading { opacity: 0.6; pointer-events: none; }

  /* Fixed, centered preview that fades + scales in over a darkening
     backdrop -- matching the reference catalog design (uploaded
     catalog.html) rather than the earlier flat, abrupt-show/hide
     modal. Driven by a CSS class (not the `hidden` attribute), since
     `display` can't be transitioned -- opacity/visibility/transform
     can. This also sidesteps the earlier `[hidden]` vs `display:`
     specificity bug entirely for this element: nothing here sets its
     own `display`, so there's no UA-stylesheet tie to lose.

     pointer-events: none ALWAYS (never `auto`, even while .visible) --
     this isn't cosmetic, it's load-bearing. Once shown, this overlay
     sits on top of the very tile the mouse is still resting on; if it
     accepted pointer events, the browser would treat the tile as
     "left" the instant the overlay appeared (it's now the topmost
     element under the cursor) even though the mouse never moved --
     which immediately fired this module's own mouseleave handler and
     hid the preview it had just shown. Confirmed directly: instrumented
     logging caught `mouseleave` firing ~1s after `mouseenter`, exactly
     when the dwell timer completed and the overlay appeared -- that's
     what "flickers and doesn't show until repositioning the mouse" was.
     The reference design had this right from the start (`.preview {
     pointer-events: none; }`, permanently) -- this was lost when
     adapting it. Dismissal relies entirely on the tile's own
     mouseleave now (move the mouse away -> hides), not a click on the
     overlay, since pointer-events: none means the overlay can never
     receive a click in the first place. */
  .preview-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                      background: rgba(20,16,12,0); opacity: 0; visibility: hidden; pointer-events: none;
                      transition: opacity 0.12s ease, background 0.12s ease, visibility 0s linear 0.12s;
                      z-index: 200; }
  .preview-overlay.visible { background: rgba(20,16,12,0.55); opacity: 1; visibility: visible;
                              transition: opacity 0.12s ease, background 0.12s ease; }
  .preview-overlay img { max-width: 92vw; max-height: 92vh; width: auto; height: auto;
                          object-fit: contain; background: var(--card-bg, #fff); border: 4px solid var(--card-bg, #fff);
                          box-shadow: 0 20px 60px rgba(0,0,0,0.5); transform: scale(0.97);
                          transition: transform 0.12s ease; }
  .preview-overlay.visible img { transform: scale(1); }

  /* Bug fix (see module docstring): `[hidden]` and a plain class
     selector both have specificity (0,1,0); author CSS loaded after the
     UA stylesheet wins that tie, so any `hidden`-toggled element that
     also sets its own `display:` stays visible without this override.
     !important beats the tie unconditionally regardless of order/
     specificity. Still needed here for OTHER hidden-toggled elements
     on pages that include this stylesheet (.preview-overlay itself no
     longer relies on `hidden` -- see above). */
  [hidden] { display: none !important; }

(function() {
  var HOVER_DELAY_MS = 700;
  var overlay = document.getElementById("preview-overlay");
  var overlayImg = document.getElementById("preview-img");
  if (!overlay || !overlayImg) return;
  var hoverTimer = null;

  function showPreview(tile) {
    overlayImg.src = tile.dataset.full;
    overlayImg.alt = tile.dataset.name || "";
    overlay.classList.add("visible");
  }
  function hidePreview() {
    overlay.classList.remove("visible");

  // Fetch-to-blob download: the plain `download` attribute on `.thumb-dl`
  // is silently ignored by browsers for a cross-origin href (full_url
  // points at Internet Archive), so a plain click just navigates/opens
  // the image instead of saving it -- confirmed IA's file-serving
  // response itself sends `Access-Control-Allow-Origin: *` (checked
  // against a real item/file, both the archive.org redirect hop and the
  // resolved ia*.us.archive.org response), so a same-origin-style fetch
  // is allowed and we can build a real local download from the bytes.
  // Falls back to opening the image in a new tab if the fetch ever
  // fails (network error, IA outage, a future file host that doesn't
  // send the header) -- never leaves the click doing nothing.
  function downloadFull(link) {
    var url = link.getAttribute("href");
    var filename = link.getAttribute("download") || "";
    link.classList.add("downloading");
    fetch(url)
      .then(function(resp) {
        if (!resp.ok) throw new Error("bad response " + resp.status);
        return resp.blob();
      })
      .then(function(blob) {
        var blobUrl = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 30000);
      })
      .catch(function() {
        window.open(url, "_blank");
      })
      .finally(function() {
        link.classList.remove("downloading");
      });
  }

  document.querySelectorAll(".preview-thumb").forEach(function(tile) {
    // Listen on the TILE (the wrapper around both the image and the
    // small download icon), not the <img> alone -- the download icon
    // is a sibling absolutely-positioned on top of the image's corner,
    // so listening on just the <img> meant the cursor landing on/near
    // that icon fired a spurious mouseleave (icon is now topmost under
    // the cursor) right as the dwell timer was about to complete,
    // resetting it -- which is why the preview only ever appeared
    // after "repositioning" the mouse. The wrapper's boundary is what
    // actually matters for "is the pointer over this tile at all".
    tile.addEventListener("mouseenter", function() {
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(function() { showPreview(tile); }, HOVER_DELAY_MS);
    });
    tile.addEventListener("mouseleave", function() {
      clearTimeout(hoverTimer);
      hidePreview();
    });
  });

  document.querySelectorAll(".thumb-dl").forEach(function(link) {
    // The icon sits inside the same tile the hover-preview timer
    // watches (deliberately -- see the tile-level listener comment
    // above), so moving the cursor toward the icon to click it never
    // leaves the tile: the dwell timer keeps running and the full
    // preview overlay was popping up right as/before the click landed.
    // Cancelling the timer (and hiding an already-shown preview) the
    // moment the cursor reaches the icon specifically -- not just the
    // tile generally -- stops that: hovering the icon is a distinct
    // intent (download) from hovering the image (preview), even though
    // both live inside the same tile boundary.
    link.addEventListener("mouseenter", function() {
      clearTimeout(hoverTimer);
      hidePreview();
    });
    link.addEventListener("click", function(e) {
      e.preventDefault();
      clearTimeout(hoverTimer);
      hidePreview();
      downloadFull(link);
    });
  });
})();

</script>
<script>

(function() {
  var INDEX_URL = '/assets/search-index.json';
  var indexPromise = null;

  function loadIndex() {
    if (!indexPromise) {
      indexPromise = fetch(INDEX_URL)
        .then(function(r) { return r.ok ? r.json() : []; })
        .catch(function() { return []; });
    }
    return indexPromise;
  }

  function render(results, matches) {
    results.innerHTML = "";
    if (!matches.length) {
      var empty = document.createElement("div");
      empty.className = "site-search-empty";
      empty.textContent = "No matches";
      results.appendChild(empty);
      return;
    }
    matches.slice(0, 20).forEach(function(item) {
      var a = document.createElement("a");
      a.className = "site-search-result";
      a.href = item.url;
      var title = document.createElement("span");
      title.textContent = item.title;
      var path = document.createElement("span");
      path.className = "site-search-result-path";
      path.textContent = item.path || "";
      a.appendChild(title);
      a.appendChild(path);
      results.appendChild(a);
    });
  }

  document.querySelectorAll(".site-search").forEach(function(wrap) {
    var input = wrap.querySelector(".site-search-input");
    var results = wrap.querySelector(".site-search-results");
    if (!input || !results) return;

    input.addEventListener("input", function() {
      var query = input.value.trim().toLowerCase();
      if (!query) { results.innerHTML = ""; return; }
      loadIndex().then(function(idx) {
        var matches = idx.filter(function(item) {
          return item.title.toLowerCase().indexOf(query) !== -1;
        });
        render(results, matches);
      });
    });

    document.addEventListener("click", function(e) {
      if (!wrap.contains(e.target)) results.innerHTML = "";
    });
  });
})();

</script>

(function() {
  var KEY = "viewer-theme-gallery";
  var DEFAULT_THEME = "dark";
  var PREVIEW_COLORS = null;
  var btn = document.getElementById("theme-toggle");
  if (!btn) return;
  var label = document.getElementById("theme-toggle-label");
  function labelFor(theme) {
    return theme === DEFAULT_THEME ? btn.dataset.toAltLabel : btn.dataset.toDefaultLabel;
  }
  function apply(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    label.textContent = labelFor(theme);
    if (PREVIEW_COLORS) {
      // colored as a literal preview of the DESTINATION theme (the one
      // a click will switch to), not the one currently showing.
      var dest = theme === DEFAULT_THEME ? btn.dataset.alt : btn.dataset.default;
      var c = PREVIEW_COLORS[dest];
      if (c) { btn.style.background = c.bg; btn.style.color = c.fg; btn.style.borderColor = c.fg; }
    }
  }
  var saved = DEFAULT_THEME;
  try { saved = localStorage.getItem(KEY) || DEFAULT_THEME; } catch (e) {}
  apply(saved);
  btn.addEventListener("click", function() {
    var current = document.documentElement.getAttribute("data-theme") || DEFAULT_THEME;
    var next = current === btn.dataset.default ? btn.dataset.alt : btn.dataset.default;
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  });
})();
