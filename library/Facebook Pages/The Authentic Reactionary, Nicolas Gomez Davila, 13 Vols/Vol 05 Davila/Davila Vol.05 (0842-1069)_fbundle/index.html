<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vol 05 Davila - Home Scholar Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/The-Home-Scholar-Library/assets/css/site.css">
<style>


  /* font-family reads the shared --site-font custom property (config.
     SITE_FONT_FAMILY) -- affects this shared chrome (breadcrumb,
     general body text) on BOTH pages that use _SHARED_STYLE.
     Deliberately does NOT touch fbundle_viewer_live.html's own quote-
     card typography (.fbundle-text-block/.fbundle-mark etc., Iowan Old
     Style/Palatino/Georgia) -- those set their own font-family at
     higher specificity and stay locked to that already-completed
     design regardless of this value, same "leave the deliberate
     typography alone" rule the home page's hero gets. */
  body { font-family: var(--site-font, system-ui, sans-serif); max-width: 60rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
  .breadcrumb a { color: var(--muted); }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .top-row-left { display: flex; align-items: center; gap: 12px; }
  h1 { margin-top: 0; }
  .btn { display: inline-block; padding: 8px 16px; border-radius: 6px; background: var(--accent); color: #fff;
         text-decoration: none; font-size: 0.9rem; border: none; cursor: pointer; }
  .btn:hover { filter: brightness(0.9); }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary { background: var(--card-bg); color: var(--fg); border: 1px solid var(--border); }
  .btn.secondary:hover { filter: none; background: var(--border); }

  /* CRITICAL: every hidden-toggled overlay/panel on both viewer pages
     (gallery's #preview-overlay/.gallery-slideshow/.slideshow-nav-group,
     fbundle's .fbundle-author-row/.fbundle-thumbs) also sets its own
     `display:` rule for when it's SHOWN -- which ties in specificity
     with the browser's built-in `[hidden]{display:none}` rule, and
     author CSS loaded after the UA stylesheet wins that tie. This is
     the actual, full explanation for the original bug report, "gallery
     page opens with 'Preparing download...' visible": that one rule
     previously lived only in PREVIEW_WIDGET_STYLE (catalog_renderer's
     node-page template) -- it was never in THIS shared style, which is
     the only stylesheet _page_shell()-based pages (gallery, fbundle)
     actually use, so the gallery page's own #zip-progress element --
     `display: flex` + `hidden` in the markup -- was visible from first
     paint on every gallery page the whole time. !important beats the
     tie unconditionally, so this belongs here, not just in the module
     that happened to need it first. (#zip-progress itself no longer
     exists -- build_design.md §8.2.6, resolved 2026-09-11, retired the
     client-side JSZip "download all" it belonged to, see pipeline/
     gallery_zips.py and pipeline/templates/gallery_viewer.html -- but
     this rule stays load-bearing for every other hidden-toggled element
     still listed above, so the history here is kept, not deleted.) */
  [hidden] { display: none !important; }

  :root { --bg: #fdfdfc; --fg: #222; --muted: #666; --card-bg: #f7f7f5; --border: #ddd; --accent: #1a5fb4; }
  [data-theme="dark"] { --bg: #16171a; --fg: #e8e8e6; --muted: #9a9a96; --card-bg: #212226; --border: #3a3b3f; --accent: #6ea3e0; }
  [data-theme="library"] { --bg: #f4ecd8; --fg: #3b2f22; --muted: #7a6a55; --card-bg: #ece0c4; --border: #cdbb92; --accent: #8c3b2e; }
  html, body { background: var(--bg); color: var(--fg); }
  a { color: var(--accent); }



  :root { --site-font: 'EB Garamond', Georgia, serif; }
  .site-nav { display: flex; align-items: center; gap: 18px; padding: 10px 0 16px; font-family: var(--site-font); flex-wrap: wrap; }
  .site-nav-home { color: #1a5fb4; text-decoration: none; font-size: 0.85rem; font-weight: 600; flex: 0 0 auto; white-space: nowrap; }
  .site-nav-home:hover { text-decoration: underline; }
  .site-pages-nav { display: flex; align-items: center; gap: 14px; flex: 0 1 auto; flex-wrap: wrap; }
  .site-pages-nav a { color: #444; text-decoration: none; font-size: 0.85rem; white-space: nowrap; }
  .site-pages-nav a:hover { color: #1a5fb4; text-decoration: underline; }
  .site-search { position: relative; flex: 1 1 auto; max-width: 360px; margin-left: auto; }
  .site-search input { width: 100%; box-sizing: border-box; padding: 6px 10px; font-size: 0.85rem;
                        border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
  .site-search-results { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #fff;
                          border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.12);
                          max-height: 320px; overflow-y: auto; z-index: 50; }
  .site-search-results:empty { display: none; }
  .site-search-result { display: block; padding: 7px 10px; font-size: 0.85rem; color: #222; text-decoration: none; border-bottom: 1px solid #f0f0f0; }
  .site-search-result:last-child { border-bottom: none; }
  .site-search-result:hover { background: #f4f6fa; }
  .site-search-result-path { display: block; font-size: 0.72rem; color: #888; margin-top: 1px; }
  .site-search-empty { padding: 8px 10px; font-size: 0.8rem; color: #888; }
  @media (max-width: 600px) {
    .site-nav { gap: 10px 14px; }
    .site-pages-nav { gap: 10px 14px; }
    .site-search { flex: 1 1 100%; max-width: none; margin-left: 0; }
  }



:root{--hs-sky-adjust:1;--hs-pulse-adjust:1;--hs-meteor-rate:1}
#hs-background{position:fixed;inset:-7%;z-index:0;overflow:hidden;pointer-events:none}
#hs-background svg{width:100%;height:100%;display:block}
.hs-pulse{animation:hsPulse calc(4.76s / var(--hs-pulse-adjust)) ease-in-out infinite alternate}
.hs-drift{animation:hsDrift calc(37.5s / var(--hs-sky-adjust)) ease-in-out infinite alternate}
.hs-meteor{opacity:0}
@keyframes hsPulse{from{opacity:.22}to{opacity:.92}}
@keyframes hsDrift{to{transform:rotate(3.5deg) scale(1.035)}}
@media(prefers-reduced-motion:reduce){.hs-pulse,.hs-drift,.hs-pulse-strong{animation:none!important}.hs-meteor{opacity:0}}

.hs-pulse-strong{animation:hsPulseStrong calc(4.76s / var(--hs-pulse-adjust)) ease-in-out infinite alternate}
@keyframes hsPulseStrong{from{opacity:.05}to{opacity:1}}

:root {
  --hs-reader-bg: #f3eadc;
  --hs-outer-bg: #f3eadc;
  --hs-reader-ink: #332f2d;
}
.hs-content {
  position: relative;
  z-index: 1;
  min-height: calc(100vh - 4rem);
  background: var(--hs-reader-bg);
  color: var(--hs-reader-ink);
  padding: 1.75rem 2rem;
  border-radius: 6px;
  box-shadow: 0 10px 34px rgba(0,0,0,0.10);
}

  /* Background System plugin (pipeline.backgrounds), wired into this page
     new this pass (library-owner instruction: fbundle pages should get
     the site's "library" decorative background, same as the library
     index/every node page, instead of nothing at all -- see
     pipeline.backgrounds' own module docstring, which had left fbundle/
     gallery pages out of that wiring on purpose until this request).
     This page keeps its own fixed, fit-to-viewport flex layout (top-row
     + fbundle-bundle, sized in vh units down to the pixel) rather than
     the generic scrolling "reading card" every other Background-wired
     page uses -- so the background style block's own .hs-content rule (the
     padded/rounded/shadowed card look) is neutralized back to a plain,
     transparent flex wrapper here, keeping ONLY the position:relative;
     z-index:1 it exists for in the first place: raising this page's real
     content above the fixed, z-index:0 #hs-background layer so the
     decorative artwork paints BEHIND it, not over it (see
     pipeline.backgrounds.render_tokens()'s own comment on why that rule
     is needed at all). Turned into a flex container filling the body
     exactly the way .top-row/.fbundle-bundle used to fill body directly,
     so their own flex:0 0 auto / flex:1 1 auto rules keep working
     unchanged one level down. */
  .hs-content {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
    /* BUG FIX (fbundle dark-mode text unreadable, 2026-09-12): the
       comment below says this block neutralizes the background style's
       own .hs-content rule back to "keeping ONLY the position:relative;
       z-index:1 it exists for in the first place" -- but it only ever
       reset background/padding/border-radius/box-shadow, never `color`.
       pipeline.backgrounds._card_style() sets `.hs-content { color:
       var(--hs-reader-ink); }`, and --hs-reader-ink is baked from
       ENGINE_COLORS for THIS page's own server-resolved decorative-
       background mode ("library" for every fbundle page, per
       render_fbundle_page()'s data_type="library" -- a completely
       different concept from THIS toggle's light/dark theme, see
       _theme_toggle_assets()'s own docstring) -- it never changes when
       the theme toggle below switches to "dark", so it was left
       cascading down, uninterrupted, into every element here that
       doesn't set its own `color` (.fbundle-text included, via ordinary
       inheritance). In library mode --hs-reader-ink (#332f2d) happens to
       look close enough to this page's real --fg (#2E2416) that the bug
       was invisible; in dark mode the card background correctly goes
       near-black via --card-bg but the text stayed pinned at that same
       dark #332f2d -- dark text on a near-black card, unreadable, which
       is what actually produced the "neither library nor dark, like a
       filter" look. Anchoring color to THIS page's own --fg (already
       correctly switched by the toggle below, and already the one
       source of truth every other element here inherits from) removes
       the leak instead of relying on --hs-reader-ink ever being kept in
       sync with it. */
    color: var(--fg);
  }

  /* FIX (BUGLIST 2026-09-11, "visual interference in the fbundle text
     box"): this page's theme toggle (pipeline.viewers._theme_toggle_assets,
     called from render_fbundle_page() with default_theme="library") sets
     data-theme="library" -- the identifier was renamed from "sepia" to
     "library" so the CSS/JS/button label would all agree (see that
     function's own docstring), but this template's selector was never
     updated to match. With no rule matching data-theme="library", every
     token below (--bg/--card-bg/--fg/--muted/--accent/--border/--shadow)
     was undefined except --mark-opacity, which made .fbundle-card's
     background/border/box-shadow and .fbundle-text-fade's gradient all
     invalid-at-computed-value-time (falling back to transparent/none) --
     the quote card rendered with no real background or border, and the
     fade gradient (which needs var(--card-bg) as its end color) had
     nothing real to fade INTO, showing whatever happened to be visible
     underneath instead. Renaming this selector to match what the JS
     actually sets is the fix -- default (":root") already carries no
     color tokens of its own, so a library owner should never see this
     theme render unstyled again regardless of which one the toggle is on. */
  :root { --mark-opacity: 0.24; }
  [data-theme="library"] { --bg: #ECE0C4; --card-bg: #F8F1DE; --fg: #2E2416; --muted: #6E5D42; --accent: #9C6B2E; --border: #D9C69B; --shadow: rgba(46,36,22,0.16); --mark-opacity: 0.24; }
  [data-theme="dark"] { --bg: #16130D; --card-bg: #221C13; --fg: #EFE3C7; --muted: #A7967A; --accent: #D6A64C; --border: #392F1F; --shadow: rgba(0,0,0,0.45); --mark-opacity: 0.30; }

  html, body { height: 100%; }
  body { margin: 0; padding: 20px; max-width: none; display: flex; flex-direction: column;
          overflow: hidden; box-sizing: border-box;
          font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
          transition: background 0.35s ease, color 0.35s ease; }
  .top-row { flex: 0 0 auto; }

  .fbundle-bundle { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0;
                      max-width: 700px; width: 100%; margin: 0 auto; } /* was 560px */

  .fbundle-card { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0;
                    background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px;
                    overflow: hidden; box-shadow: 0 10px 30px var(--shadow); }

  .fbundle-text-block { position: relative; flex: 0 0 auto; padding: 32px 36px 20px; box-sizing: border-box; }
  .fbundle-mark { position: absolute; top: -4px; left: 16px; font-size: 64px; line-height: 1;
                    color: var(--accent); opacity: var(--mark-opacity); font-family: Georgia, serif;
                    pointer-events: none; user-select: none; }

  /* display: flow-root gives this wrapper its own Block Formatting Context.
     Without it, .fbundle-text's bottom margin (margin: 0 0 16px) collapses
     straight through this wrapper's bottom edge instead of being contained
     inside it, so the wrapper's measured height comes up 16px short of
     "text + its own margin." Since .fbundle-text-fade is `position: absolute;
     bottom: 16px;` *inside this wrapper*, that shortfall drags the fade band
     up and away from the text's true bottom edge -- landing mid-text instead
     of hugging the last line, which is what produced the "gradient/film"
     artifact appearing to slide through the quote text near the scrollbar. */
  .fbundle-quote-wrap { position: relative; display: flow-root; }
  .fbundle-text { position: relative; font-size: 19px; line-height: 1.55; font-style: italic;
                    white-space: pre-line; margin: 0 0 16px; max-height: 24vh; overflow-y: auto;
                    scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
  .fbundle-text::-webkit-scrollbar { width: 6px; }
  .fbundle-text::-webkit-scrollbar-track { background: transparent; }
  .fbundle-text::-webkit-scrollbar-thumb { background: var(--accent); opacity: 0.4; border-radius: 999px; }
  .fbundle-text-fade { position: absolute; left: 0; right: 6px; bottom: 16px; height: 36px;
                         background: linear-gradient(to bottom, transparent, var(--card-bg));
                         pointer-events: none; opacity: 0; transition: opacity 0.2s ease; }
  .fbundle-quote-wrap.overflowing .fbundle-text-fade { opacity: 1; }

  .fbundle-author-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .fbundle-author-rule { flex: 1 1 auto; height: 1px; background: var(--border); }
  .fbundle-author { flex: 0 0 auto; font-style: normal; font-size: 13px; letter-spacing: 0.04em;
                      color: var(--muted); white-space: nowrap; }

  .fbundle-image-wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center;
                          background: var(--bg); border-top: 1px solid var(--border); }
  .fbundle-image { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }

  /* Layout swap (new, 2026-09-12): purely ergonomic/visual toggle,
     mirrors the same feature on the offline/standalone viewer
     (templates/fbundle_viewer.html) -- lets the image sit on top and
     the quote text underneath instead of the default text-on-top/
     image-on-bottom stacking. .fbundle-card is already a column
     flexbox with .fbundle-text-block then .fbundle-image-wrap as its
     two children in that fixed DOM order, so reversing the visual
     stacking is just flex-direction: column-reverse -- no DOM
     reshuffling needed (unlike the offline viewer, this page's markup
     is static, so the toggle script below just flips this class, no
     re-render). The one thing that DOES need to move is
     .fbundle-image-wrap's own border: it's border-top so it reads as
     "top of the image, bottom of the text" in the default order;
     reversed, that same seam is the image's BOTTOM edge, so this swaps
     it there instead of leaving a stray line at the outer top edge of
     .fbundle-card. */
  .fbundle-card.swapped { flex-direction: column-reverse; }
  .fbundle-card.swapped .fbundle-image-wrap { border-top: none; border-bottom: 1px solid var(--border); }

  /* Multi-image row (design_2 §2.3, revived compact) -- only shown for
     a pair with more than one image (JS sets `hidden`), slim (half the
     control bar's own height) since real estate here is tight; space
     for it comes out of the quote box above (24vh, down from 32vh) per
     that tradeoff. Horizontal-scrolling filmstrip, not a wrap, so an
     unusually large image count (design_2: ~2-10 typical) never grows
     the row's height -- it only ever gets wider than the viewport,
     which the scrollbar/scroll handles. */
  .fbundle-thumbs { flex: 0 0 auto; display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden;
                      padding: 2px 2px 6px; margin-top: 8px;
                      scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
  .fbundle-thumbs::-webkit-scrollbar { height: 5px; }
  .fbundle-thumbs::-webkit-scrollbar-track { background: transparent; }
  .fbundle-thumbs::-webkit-scrollbar-thumb { background: var(--accent); opacity: 0.4; border-radius: 999px; }
  .fbundle-thumb-tile { flex: 0 0 auto; height: 22px;
                          width: 22px; border: none; padding: 0;
                          cursor: pointer; border-radius: 3px; overflow: hidden; opacity: 0.6; }
  .fbundle-thumb-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fbundle-thumb-tile.active { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }

  .fbundle-empty { text-align: center; color: var(--muted); font-style: italic; padding: 80px 0; }

  /* Segmented control bar -- Prev, count, Next, Random, Mode, in that
     exact order (matches the standalone after direct iteration on this
     point). flex: 0 0 auto keeps it pinned at natural size so it can
     never be pushed below the fold; body's own overflow:hidden means
     only .fbundle-text scrolls, never the page. */
  .fbundle-controls { flex: 0 0 auto; display: flex; align-items: stretch; justify-content: center; gap: 1px;
                        margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
                        background: var(--border); }
  .fbundle-controls button, .fbundle-controls a, .fbundle-controls .fbundle-count {
    flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 8px;
    border: none; background: var(--card-bg); color: var(--muted); text-decoration: none;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 13px; letter-spacing: 0.03em;
  }
  .fbundle-controls button, .fbundle-controls a { cursor: pointer; transition: background 0.2s ease, color 0.2s ease; }
  .fbundle-controls button:hover, .fbundle-controls a:hover { background: var(--bg); color: var(--fg); }
  .fbundle-controls .fbundle-count { flex: 0 0 auto; min-width: 56px; white-space: nowrap; }
  .fbundle-controls svg { width: 16px; height: 16px; stroke: currentColor; fill: none; flex: 0 0 auto; }
  .fbundle-controls .label { display: none; }
  @media (min-width: 700px) { .fbundle-controls .label { display: inline; } } /* was 560px */

  /* Fullscreen mode (new, 2026-09-12; width-cap removal reverted
     2026-09-12): gives the reading card MORE VERTICAL ROOM to expand
     into -- both a real Fullscreen API request on <html> (see the
     script below) AND, whether or not the browser grants that (some
     embeds/iframes refuse it outright), this class drops every bit of
     chrome ABOVE the card that isn't the card itself: .top-row
     (breadcrumb + theme toggle) and body's own 20px padding. The
     control bar (Prev/count/Next/Random/Download/Fullscreen) stays put
     -- it's the only way back out short of Esc, and it's already
     flex:0 0 auto so it costs the same sliver of height it always did.

     Deliberately does NOT touch .fbundle-bundle's own max-width: 700px
     -- an earlier version of this rule also set max-width: none here,
     which stretched the card edge-to-edge across the whole screen
     (border-radius/shadow vanishing at 0 margin, the empty image area
     ballooning) instead of just letting the SAME card grow taller into
     the space .top-row/padding freed up. "The viewer must remain
     intact" -- same card, same proportions, just more headroom -- so
     the width cap stays exactly as it is outside fullscreen too. */
  body.fbundle-fullscreen { padding: 0; }
  body.fbundle-fullscreen .top-row { display: none; }

  /* Status line (spinner/error) -- flex: 0 0 auto so it never grows,
     contributes ~0 height while hidden (the default state). */
  .fbundle-status { flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
                      gap: 10px; margin-top: 8px; font-size: 0.85rem; color: var(--muted); }
  .fbundle-error button { margin-left: 6px; }

</style>
</head>
<body>
<div id="hs-background" aria-hidden="true"></div>
<div class="hs-content">
<div class="top-row">
  <div class="top-row-left"><a class="site-nav-home" href="/The-Home-Scholar-Library/">&#9738; Home</a><div class="breadcrumb"><a href="/The-Home-Scholar-Library/library/">Home Scholar Library</a> / <a href="/The-Home-Scholar-Library/library/Facebook%20Pages/">Facebook Pages</a> / <a href="/The-Home-Scholar-Library/library/Facebook%20Pages/The%20Authentic%20Reactionary%2C%20Nicolas%20Gomez%20Davila%2C%2013%20Vols/">The Authentic Reactionary, Nicolas Gomez Davila, 13 Vols</a> / <a href="/The-Home-Scholar-Library/library/Facebook%20Pages/The%20Authentic%20Reactionary%2C%20Nicolas%20Gomez%20Davila%2C%2013%20Vols/Vol%2005%20Davila/">Vol 05 Davila</a></div></div>
  <button type="button" class="btn secondary" id="theme-toggle" data-default="library" data-alt="dark" data-to-alt-label="🌙 Dark mode" data-to-default-label="📚 Library mode"><span id="theme-toggle-label">🌙 Dark mode</span></button>
</div>

<div class="fbundle-bundle" id="fbundle-bundle">
  <div class="fbundle-card">
    <div class="fbundle-text-block">
      <div class="fbundle-mark">“</div>
      <div class="fbundle-quote-wrap" id="fb-quote-wrap">
        <div class="fbundle-text" id="fb-text">Loading…</div>
        <div class="fbundle-text-fade"></div>
      </div>
      <div class="fbundle-author-row" id="fb-author-row" hidden>
        <div class="fbundle-author-rule"></div>
        <div class="fbundle-author" id="fb-author"></div>
      </div>
    </div>
    <div class="fbundle-image-wrap"><img id="fb-image" class="fbundle-image" src="" alt=""></div>
  </div>
  <div class="fbundle-thumbs" id="fb-thumbs" hidden></div>
  <div class="fbundle-controls">
    <button type="button" id="fb-prev"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg><span class="label">Prev</span></button>
    <div class="fbundle-count" id="fb-count"></div>
    <button type="button" id="fb-next"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg><span class="label">Next</span></button>
    <button type="button" id="fb-random"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg><span class="label">Random</span></button>
    <button type="button" id="fb-fullscreen"></button>
    <button type="button" id="fb-swap"></button>
    <a id="fb-download" href="https://archive.org/download/home-scholar-archive/Facebook%20Pages/The%20Authentic%20Reactionary%2C%20Nicolas%20Gomez%20Davila%2C%2013%20Vols/Vol%2005%20Davila/Davila%20Vol.05%20%280842-1069%29_fbundle.zip" download><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg><span class="label">Download</span></a>
  </div>
  <div class="fbundle-status">
    <span id="fb-spinner" hidden>Loading…</span>

      return r.text();
    }).then(parseQuote);
  }

  function prefetchFirstImage(pair) {
    if (!pair || !pair.images.length) return;
    var img = new Image();
    img.src = pair.images[0];
  }

  // ---- themed scrollbar + fade for a long quote, capped at 24vh --
  // only shown/scrollable when the text actually overflows. -----------
  //
  // BUGLIST fix ("visual interference in the fbundle text box"): this
  // used to check only textEl.scrollHeight > textEl.clientHeight -- IS
  // there more text than fits, at all -- which is true for the entire
  // life of a long quote, including after the visitor has scrolled all
  // the way down to read its last line. The fade/shadow (.fbundle-text-
  // fade, opacity toggled by the "overflowing" class) therefore never
  // went away for a long quote -- it sat over the bottom of the text
  // permanently, looking like leftover visual debris rather than the
  // "more below, scroll for it" cue it's meant to be. Fixed to match
  // the standalone/offline viewer's own already-correct logic
  // (templates/fbundle_viewer.html's updateOverflowFade()): the real
  // question is whether there's more content BELOW THE CURRENT SCROLL
  // POSITION (scrollHeight - scrollTop - clientHeight), not just
  // whether the box overflows at all -- so the fade now correctly
  // disappears once scrolled to the bottom, and reappears if scrolled
  // back up. Needs its own "scroll" listener on textEl (added below,
  // next to the existing "resize" one) since scrolling the text changes
  // scrollTop without firing a resize event.
  function updateTextOverflow() {
    var hasMoreBelow = textEl.scrollHeight - textEl.scrollTop - textEl.clientHeight > 4;
    quoteWrapEl.classList.toggle("overflowing", hasMoreBelow);
  }

  // ---- shared "make this image the active one" step -- used both by
  // clicking a thumbnail directly and by fb-next's image-then-quote
  // cycling below, so the main-image swap + active-thumb highlight
  // never has to be kept in sync in two places. ------------------------
  function setActiveImage(url) {
    currentImage = url;
    imageEl.src = url;
    var tiles = thumbsEl.querySelectorAll(".fbundle-thumb-tile");
    for (var i = 0; i < tiles.length; i++) {
      var isActive = tiles[i].dataset.url === url;
      tiles[i].classList.toggle("active", isActive);
      if (isActive) tiles[i].scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }

  function renderPair(parsed) {
    var pair = PAIRS[current];
    textEl.textContent = parsed.quote;
    textEl.scrollTop = 0;
    updateTextOverflow();

    if (parsed.author) {
      authorEl.textContent = "\u2014 " + parsed.author;
      authorRowEl.hidden = false;
    } else {
      authorRowEl.hidden = true;
    }

    if (currentImage === null) currentImage = pair.images[0] || null;
    imageEl.src = currentImage || "";
    imageEl.alt = parsed.quote.slice(0, 60);

    // ---- multi-image row (design_2 §2.3, compact) -- only for a pair
    // with more than one image; clicking a tile swaps the main image
    // without touching the quote/text or re-fetching anything. --------
    if (pair.images.length > 1) {
      thumbsEl.hidden = false;
      thumbsEl.innerHTML = "";
      pair.images.forEach(function(url) {
        var tile = document.createElement("button");
        tile.type = "button";
        tile.dataset.url = url;
        tile.className = "fbundle-thumb-tile" + (url === currentImage ? " active" : "");
        tile.innerHTML = '<img src="' + url + '" alt="" loading="lazy">';
        tile.addEventListener("click", function() { setActiveImage(this.dataset.url); });
        thumbsEl.appendChild(tile);
      });
    } else {
      thumbsEl.hidden = true;
      thumbsEl.innerHTML = "";
    }

    countEl.textContent = (current + 1) + " / " + PAIRS.length;
  }

  // ---- direct/blocking fetch with 1-2 silent retries before a visible
  // error state (§2.4) --------------------------------------------------
  function loadPair(index, attempt) {
    attempt = attempt || 0;
    current = index;
    currentImage = null;
    var pair = PAIRS[current];
    var cached = cache[pair.enumeration];

    errorEl.hidden = true;

    if (cached) {
      spinnerEl.hidden = true;
      renderPair(cached);
      prefetchNeighbors();
      return;
    }

    spinnerEl.hidden = false;
    fetchText(pair).then(function(parsed) {
      cache[pair.enumeration] = parsed;
      spinnerEl.hidden = true;
      if (current === index) renderPair(parsed);
      prefetchNeighbors();
    }).catch(function() {
      if (attempt < 2) {
        loadPair(index, attempt + 1);
      } else {
        spinnerEl.hidden = true;
        errorEl.hidden = false;
      }
    });
  }

  function prefetchNeighbors() {
    prefetchFirstImage(PAIRS[(current + 1) % PAIRS.length]);
    prefetchFirstImage(PAIRS[(current - 1 + PAIRS.length) % PAIRS.length]);
  }

  // ---- Next cycles through the current pair's remaining images first
  // (mirrors clicking through its own thumbnail row left-to-right),
  // only advancing to the next quote once its last image is already
  // showing. A single-image pair -- or a multi-image one already on its
  // last image -- behaves exactly as before and goes straight to the
  // next pair. --------------------------------------------------------
  function advanceToNextImage() {
    var pair = PAIRS[current];
    if (!pair || !pair.images || pair.images.length < 2) return false;
    var idx = pair.images.indexOf(currentImage);
    if (idx === -1 || idx >= pair.images.length - 1) return false;
    setActiveImage(pair.images[idx + 1]);
    return true;
  }

  document.getElementById("fb-prev").addEventListener("click", function() {
    loadPair((current - 1 + PAIRS.length) % PAIRS.length);
  });
  document.getElementById("fb-next").addEventListener("click", function() {
    if (advanceToNextImage()) return;
    loadPair((current + 1) % PAIRS.length);
  });
  document.getElementById("fb-random").addEventListener("click", function() {
    if (PAIRS.length < 2) return;
    var next;
    do { next = Math.floor(Math.random() * PAIRS.length); } while (next === current);
    loadPair(next);
  });
  document.getElementById("fb-retry").addEventListener("click", function() { loadPair(current); });
  window.addEventListener("resize", updateTextOverflow);
  textEl.addEventListener("scroll", updateTextOverflow);

  if (PAIRS.length) {
    loadPair(0);
  } else {
    document.getElementById("fbundle-bundle").innerHTML = '<div class="fbundle-empty">No quotes in this bundle.</div>';
  }
})();
</script>

<!-- Fullscreen mode (new, 2026-09-12): "give the viewer maximum
     vertical space" -- requests the real Fullscreen API on <html> where
     the browser allows it, and either way toggles body.fbundle-
     fullscreen (see that class's own CSS comment above) so the top-row
     (breadcrumb + theme toggle) and body's outer padding drop out,
     letting .fbundle-bundle grow to fill what's left. Listens for the
     browser's own fullscreenchange event (every vendor-prefixed variant
     still in real-world use) rather than only reacting to its own
     click, so the CSS class stays in sync when the visitor exits with
     Esc, a browser/OS fullscreen shortcut, or any other route that
     bypasses this button entirely -- exactly the same "don't trust your
     own click handler as the only source of truth" reasoning
     _theme_toggle_assets() already applies to data-theme. Falls back to
     the CSS-only maximize (no real Fullscreen API call) when the API
     doesn't exist or a request is refused (sandboxed iframes commonly
     block it) -- "maximum vertical space" still means something even
     when true fullscreen isn't available. -->
<script>
(function() {
  var btn = document.getElementById("fb-fullscreen");
  if (!btn) return;
  var ICONS = {
    enter: '<svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M16 3h3a2 2 0 0 1 2 2v3"></path><path d="M8 21H5a2 2 0 0 1-2-2v-3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg><span class="label">Fullscreen</span>',
    exit: '<svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 0 1-2 2H4"></path><path d="M15 3v3a2 2 0 0 0 2 2h3"></path><path d="M9 21v-3a2 2 0 0 0-2-2H4"></path><path d="M15 21v-3a2 2 0 0 1 2-2h3"></path></svg><span class="label">Exit fullscreen</span>'
  };

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  }
  // CSS-only maximize also stays on while genuinely fullscreen (a
  // request can succeed without the class ever having been set by a
  // fallback path), so this OR's the two together rather than trusting
  // just one.
  function isMaximized() {
    return isFullscreen() || document.body.classList.contains("fbundle-fullscreen");
  }
  function syncButton() {
    btn.innerHTML = isMaximized() ? ICONS.exit : ICONS.enter;
  }
  function syncFromBrowser() {
    // Only follows the BROWSER's own fullscreen state here -- the CSS-
    // only fallback (no real Fullscreen API involved) is added/removed
    // directly by the click handler below, not by this listener.
    if (isFullscreen()) document.body.classList.add("fbundle-fullscreen");
    else if (!document.body.dataset.fbFullscreenFallback) document.body.classList.remove("fbundle-fullscreen");
    syncButton();
  }

  btn.innerHTML = ICONS.enter;
  btn.addEventListener("click", function() {
    if (!isMaximized()) {
      var el = document.documentElement;
      var request = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (request) {

          // Refused (common in a sandboxed iframe) -- fall back to the
          // CSS-only maximize instead of leaving the click looking like
          // it did nothing.
          document.body.dataset.fbFullscreenFallback = "1";
          document.body.classList.add("fbundle-fullscreen");
          syncButton();
        });
      } else {
        document.body.dataset.fbFullscreenFallback = "1";
        document.body.classList.add("fbundle-fullscreen");
        syncButton();
      }
    } else if (isFullscreen()) {
      var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (exit) exit.call(document);
    } else {
      delete document.body.dataset.fbFullscreenFallback;
      document.body.classList.remove("fbundle-fullscreen");
      syncButton();
    }
  });
  document.addEventListener("fullscreenchange", syncFromBrowser);
  document.addEventListener("webkitfullscreenchange", syncFromBrowser);
  document.addEventListener("msfullscreenchange", syncFromBrowser);
})();
</script>

<!-- Layout swap (new, 2026-09-12; default flipped 2026-09-13):

     latter ("swapped") is now what a first-time visitor sees; clicking
     the button goes back to text-on-top. Unlike the offline viewer

     rather than rebuilt per quote, so the toggle is just a class flip on
     .fbundle-card -- no re-render, and it survives Prev/Next/Random
     (loadPair()/renderPair() never touch this class). Persisted under
     its own storage key, separate from the theme toggle above. -->
<script>
(function() {
  var btn = document.getElementById("fb-swap");

  if (!btn || !card) return;
  var ICON_SWAP = '<svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v14"></path><path d="M4 7l4-4 4 4"></path><path d="M16 21V7"></path><path d="M12 17l4 4 4-4"></path></svg>';

  function isSwapped() {
    return card.classList.contains("swapped");

  function apply(swapped) {
    card.classList.toggle("swapped", swapped);
    syncButton();
    try { localStorage.setItem("fbundle-layout", swapped ? "swapped" : "default"); } catch (e) {}
  }

  var saved = null;
  try { saved = localStorage.getItem("fbundle-layout"); } catch (e) {}
  // Default flipped 2026-09-13: image-on-top ("swapped") now ships as
  // the default -- anything other than an explicit, previously-saved
  // "default" lands there, mirroring the offline viewer's own
  // initLayout() (templates/fbundle_viewer.html).
  apply(saved !== "default");

  btn.addEventListener("click", function() { apply(!isSwapped()); });
})();
</script>

<script>


(function() {
  var KEY = "viewer-theme-fbundle";
  var DEFAULT_THEME = "library";
  var PREVIEW_COLORS = {"library": {"bg": "#ECE0C4", "fg": "#2E2416"}, "dark": {"bg": "#16130D", "fg": "#EFE3C7"}};
  var BACKGROUND_MODES = {"library": "library", "dark": "dark"};
  var btn = document.getElementById("theme-toggle");
  if (!btn) return;
  var label = document.getElementById("theme-toggle-label");
  function labelFor(theme) {
    return theme === DEFAULT_THEME ? btn.dataset.toAltLabel : btn.dataset.toDefaultLabel;
  }
  // Re-invokes the SAME background runtime backgrounds.py's own
  // init_script already called once on load, against the SAME
  // #hs-background target/identity -- mirrors
  // pipeline.webbook_nav.script()'s own applyBackgroundOverride(), just
  // driven by this toggle instead of that reader-settings panel. A
  // no-op wherever BACKGROUND_MODES is null (every caller but fbundle)
  // or the runtime/target genuinely isn't on the page.
  function applyBackgroundMode(theme) {
    if (!BACKGROUND_MODES) return;
    var mode = BACKGROUND_MODES[theme];
    if (!mode || !window.HomeScholarBackgrounds) return;
    var target = document.getElementById("hs-background");
    if (!target) return;
    var identity = target.dataset.identity;
    if (!identity) return;
    var result;
    try {
      result = window.HomeScholarBackgrounds.render({
        target: target,
        mode: mode,
        identity: identity,
        date: new Date().toISOString().slice(0, 10)
      });
    } catch (e) { return; }
    if (result) {
      var root = document.documentElement.style;
      if (result.reader) {
        root.setProperty("--hs-reader-bg", result.reader);
        root.setProperty("--hs-outer-bg", result.reader);
      }
      if (result.ink) root.setProperty("--hs-reader-ink", result.ink);
    }
  }
  function apply(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    label.textContent = labelFor(theme);
    if (PREVIEW_COLORS) {
      // colored as a literal preview of the DESTINATION theme (the one
      // a click will switch to), not the one currently showing.
      var dest = theme === DEFAULT_THEME ? btn.dataset.alt : btn.dataset.default;
      var c = PREVIEW_COLORS[dest];
      if (c) { btn.style.background = c.bg; btn.style.color = c.fg; btn.style.borderColor = c.fg; }
    }
    applyBackgroundMode(theme);
  }

  // whatever localStorage held outright ("saved = localStorage.getItem(KEY)
  // || DEFAULT_THEME"), with no check that the stored value is actually
  // one of THIS toggle's two known themes (btn.dataset.default/.alt). A
  // visitor who saved a theme under an earlier identifier -- e.g.
  // "sepia", fbundle's OWN default_theme value before the 2026-09-11
  // rename documented on fbundle_viewer_live.html's [data-theme="library"]
  // rule -- keeps that stale value in localStorage across the rename, so
  // apply() below was setting data-theme="sepia" on load: a value neither
  // [data-theme="library"] nor [data-theme="dark"] matches, so every
  // themed custom property fell back to unset/transparent (the page
  // rendered in neither mode) while the label, driven by the SAME
  // mismatch (saved !== DEFAULT_THEME), read "Library mode" -- the button
  // offering the one theme it wasn't already showing. Clicking it called
  // apply(btn.dataset.default) and self-healed, which is what made the
  // bug look click-fixable instead of permanently broken. Validating
  // against the button's own two real values here (matching the offline
  // standalone viewer's already-correct `saved === "dark" ? "dark" :
  // "library"` fallback in templates/fbundle_viewer.html) means an
  // unrecognized/stale value is discarded in favor of DEFAULT_THEME
  // instead of being applied verbatim.
  var saved = DEFAULT_THEME;
  try {
    var stored = localStorage.getItem(KEY);
    if (stored === btn.dataset.default || stored === btn.dataset.alt) saved = stored;
  } catch (e) {}
  apply(saved);
  btn.addEventListener("click", function() {
    var current = document.documentElement.getAttribute("data-theme") || DEFAULT_THEME;
    var next = current === btn.dataset.default ? btn.dataset.alt : btn.dataset.default;
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  });
})();

  var RETRY_BASE_DELAY_MS = 400;  // doubles each retry, plus jitter
  var CHECK_TIMEOUT_MS = 4000;    // give up on one attempt after this

    if (!a || !a.getAttribute("href")) return false;
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return false;
    var target = a.getAttribute("target");
    if (target && target !== "_self") return false;
    if (a.hasAttribute("download")) return false;
    var url;
    try { url = new URL(a.href, window.location.href); } catch (err) { return false; }
    if (url.protocol !== "http:" && url.protocol !== "https:") return false;
    if (url.origin !== window.location.origin) return false;
    // Fragment-only link on the current document -- nothing to verify.
    if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return false;
    return true;
  }

    var hasAbort = "AbortController" in window;
    var controller = hasAbort ? new AbortController() : null;
    var timer = controller ? setTimeout(function() { controller.abort(); }, CHECK_TIMEOUT_MS) : null;
    return fetch(url, {
      method: "HEAD",
      cache: "no-store",
      signal: controller ? controller.signal : undefined

      throw err;
    });

  function verify(url, attemptNum) {
    return checkOnce(url).then(function(resp) {

      // retrying won't change that, so stop and let it through as-is

      if (resp.status === 404) return true;
      if (!resp.ok && attemptNum < MAX_RETRIES) return retryAfterDelay(url, attemptNum);
      return true;
    }).catch(function() {

      // transient-hiccup case this exists for. Worth a retry.
      if (attemptNum < MAX_RETRIES) return retryAfterDelay(url, attemptNum);
      return true;
    });

  function retryAfterDelay(url, attemptNum) {
    var delay = RETRY_BASE_DELAY_MS * Math.pow(2, attemptNum) + Math.random() * 150;
    return new Promise(function(resolve) {
      setTimeout(function() { resolve(verify(url, attemptNum + 1)); }, delay);
    });
  }

  var indicatorTimer = null;
  var indicatorEl = null;

  function ensureIndicatorStyle() {
    if (document.getElementById("nav-reliability-style")) return;
    var style = document.createElement("style");
    style.id = "nav-reliability-style";
    style.textContent =
      "@keyframes nav-reliability-sweep{0%{background-position:200% 0}100%{background-position:-200% 0}}" +
      "#nav-reliability-bar{position:fixed;top:0;left:0;height:3px;width:100%;z-index:99999;" +
      "background:linear-gradient(90deg,transparent,#9C6B2E,transparent);background-size:200% 100%;" +
      "animation:nav-reliability-sweep 1s linear infinite;opacity:0.7;pointer-events:none;}";
    document.head.appendChild(style);
  }

  function showIndicator() {
    if (indicatorEl) return;
    ensureIndicatorStyle();
    indicatorEl = document.createElement("div");
    indicatorEl.id = "nav-reliability-bar";
    indicatorEl.setAttribute("aria-hidden", "true");
    document.body.appendChild(indicatorEl);
  }

  function hideIndicator() {
    if (indicatorTimer) { clearTimeout(indicatorTimer); indicatorTimer = null; }
    if (indicatorEl) { indicatorEl.remove(); indicatorEl = null; }
  }

  document.addEventListener("click", function(e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!isEligible(a, e)) return;

    e.preventDefault();
    var href = a.href;
    indicatorTimer = setTimeout(showIndicator, INDICATOR_DELAY_MS);

    verify(href, 0).then(function() {
      hideIndicator();
      window.location.href = href;
    }).catch(function() {
      // Nothing above should reject, but never leave a click doing
      // nothing -- fall through to a normal navigation regardless.
      hideIndicator();
      window.location.href = href;
    });
  }, true);
})();

</script>
</body>
</html>
