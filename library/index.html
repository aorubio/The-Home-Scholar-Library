<!--
templates/library_index.html
=============================
Real template for pipeline.library_index.render_library_index() --
consumed via plain double-brace-token substitution
(pipeline.library_index._load_template()), same convention as every
other *.html file in this folder. Falls back to a minimal built-in
default (pipeline.library_index._DEFAULT_LIBRARY_INDEX_TEMPLATE) if this
file goes missing or loses its DATA_URL token.

CAUTION for anyone editing this file's own comments: every token is
substituted via plain str.replace(), not a real templating engine (same
convention/caveat as every other *.html file here) -- writing a token's
literal double-brace spelling in PROSE, even inside this comment block,
gets clobbered by that same replace() call. Spell them out some other
way (as done throughout this comment) instead.

Look and feel: deliberately reuses the SAME chrome/colors/typography every
other page on the site already uses -- the shared site-nav header and its
style block (pipeline.site_nav, config.SITE_FONT_FAMILY via
var(--site-font)), and the
same link-blue/border-gray values pipeline.catalog_renderer's own node
template uses (#1a5fb4 links, #222 body text, #ddd/#eee borders) -- NOT
example/library_index_mockup.html's own standalone cream/sepia palette
and Google Fonts import. Structure/behavior below (tabs, the Books/
Authors toggle, the alpha index, the author tree, badges) is carried over
from that mockup close to verbatim per docs/library-index-integration.md
-- only the visual skin and the "how do I get DATA" line changed (fetch()
instead of an inlined <script type="application/json"> blob).

Deliberately no `background` set on <body>/<html> here, same omission
every other page template in this pipeline already makes -- this was
reserved for a site-wide page-background feature, and that feature has
now arrived: pipeline.backgrounds (its own module, not folded into
pipeline.site_nav) owns it, via the BACKGROUND / BACKGROUND_STYLE /
BACKGROUND_CONTENT_OPEN / BACKGROUND_CONTENT_CLOSE / BACKGROUND_SCRIPT
tokens below (spelled here without their double braces on purpose --
see this file's own CAUTION note above about why). This page's
own body/html rule still carries no explicit background color --
correct on purpose, since the plugin's own fixed layer supplies it now
instead.
-->

  if (b.isReadOnline) out += '<a class="badge badge-readonline" href="/The-Home-Scholar-Library/library/#readonline">Read Online</a>';
  return out;
}
function fbundleBadges(isNew){
  return isNew ? '<a class="badge badge-new" href="/The-Home-Scholar-Library/#latest">New</a>' : '';
}
function escBadge(s){
  return String(s).replace(/[&<>"']/g, function(c){

<script>
(function(){
  var BASE_PATH = "/The-Home-Scholar-Library";
  var DATA_URL = "/The-Home-Scholar-Library/assets/library-index-data.json";

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function encodePath(p){ return p.split('/').map(encodeURIComponent).join('/'); }
  function bookHref(path){ return BASE_PATH + '/library/' + encodePath(path) + '/'; }
  function authorHref(name){ return BASE_PATH + '/library/' + encodeURIComponent(name) + '/'; }

  // Natural-ish sort -- split into text/number runs so "Book 2" < "Book 10".
  function natKey(str){ return String(str).toLowerCase().match(/\d+|\D+/g) || [str]; }
  function natCompare(a, b){
    var ak = natKey(a), bk = natKey(b);
    var len = Math.max(ak.length, bk.length);
    for (var i = 0; i < len; i++){
      var av = ak[i], bv = bk[i];
      if (av === undefined) return -1;
      if (bv === undefined) return 1;
      var an = /^\d+$/.test(av), bn = /^\d+$/.test(bv);
      if (an && bn){
        var d = parseInt(av,10) - parseInt(bv,10);
        if (d !== 0) return d;
      } else if (av !== bv) return av < bv ? -1 : 1;
    }
    return 0;
  }
  function firstLetter(str){
    var m = String(str).trim().match(/[A-Za-z]/);
    return m ? m[0].toUpperCase() : '#';
  }

  // Strip a leading catalog-numbering prefix ("Book 01.", "Volume 09.",
  // "GA-7,", a bare "04 ") so sorting/grouping/display go by the actual
  // title instead of clustering everything under one letter -- see
  // docs/library-index-integration.md §2 "Title sort & display". Only a
  // known prefix-word whitelist (plus bare leading digits) qualifies, so
  // "Mahabharata 3 Vols. Translated By M N Dutt" is left alone.
  var PREFIX_RE = /^(?:(?:Book|Volume|Vol|Part|Chapter|No\.?|Number|GA)[\s\-]*)?\d{1,4}[.,:)\-]?\s+(?=\S)/i;

  // GA-prefixed titles (Rudolf Steiner's Gesamtausgabe catalog numbers)
  // are a special case of the above, checked FIRST: the real on-disk
  // prefix is "GA<identifier>," followed by a space (e.g. "GA116, ",
  // "GA-7, ", "GA 291a, ") -- unlike the plain PREFIX_RE case above,
  // where the whole matched prefix is just noise to discard, the GA
  // identifier itself is real reference information a visitor may still
  // want to see. So instead of being dropped, it's moved to a
  // parenthesized suffix on the (sorted/grouped/displayed) title --
  // "GA116, Nature of Man" -> "Nature of Man (GA116)" -- so sorting/
  // grouping go by the actual title (the point of stripping it from the
  // front), while the GA number is still visible, just at the end, sans
  // its comma. Falls through to the generic PREFIX_RE above (which still
  // matches a bare "GA" prefix with no comma) if this doesn't match --
  // GA remains in that alternation on purpose, as the fallback for that
  // edge case.
  var GA_PREFIX_RE = /^GA\s*([^,]+),\s+(?=\S)/i;

  function stripNumberPrefix(title){
    title = String(title);
    var ga = title.match(GA_PREFIX_RE);
    if (ga) return title.slice(ga[0].length) + ' (GA' + ga[1].trim() + ')';
    var m = title.match(PREFIX_RE);
    return m ? title.slice(m[0].length) : title;
  }

  var ALPHABET = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  function buildAlphaIndex(letters, containerId){
    var present = {};
    letters.forEach(function(l){ present[l] = true; });
    var html = '<a href="#" class="li-alpha-link li-top" data-jump-top="1">&uarr; Top</a>';
    ALPHABET.forEach(function(letter){
      html += present[letter]
        ? '<a class="li-alpha-link" href="#' + containerId + '-' + letter + '">' + letter + '</a>'
        : '<span class="li-alpha-link li-disabled">' + letter + '</span>';
    });
    return html;
  }

  var DATA = null;
  var NEWEST_SET = {};
  function isNewItem(path){ return !!NEWEST_SET[path]; }

  function renderBooksFlat(authors, containerId){
    var rows = [];
    authors.forEach(function(a){
      a.books.forEach(function(b){
        rows.push({ author: a.name, book: b, displayTitle: stripNumberPrefix(b.title) });
      });
    });
    rows.sort(function(x,y){ return natCompare(x.displayTitle, y.displayTitle); });

    var lettersSeen = [], html = '', lastLetter = null;
    rows.forEach(function(r){
      var L = firstLetter(r.displayTitle);
      if (L !== lastLetter){
        html += '<h2 class="li-letter-heading" id="' + containerId + '-' + L + '">' + L + '</h2>';
        lettersSeen.push(L); lastLetter = L;
      }
      html += '<div class="li-row">' +
                '<span class="li-row-title"><a href="' + bookHref(r.book.path) + '">' + esc(r.displayTitle) + '</a>' +
                  bookBadges(r.book, isNewItem(r.book.path)) + '</span>' +
                '<span class="li-row-author">by <a href="' + authorHref(r.author) + '">' + esc(r.author) + '</a></span>' +
              '</div>';
    });
    if (!rows.length) html = '<div class="li-empty-note">No items in this view yet.</div>';
    return { html: html, letters: lettersSeen };
  }

  function renderAuthorsTree(authors, containerId){
    var sorted = authors.slice().sort(function(a,b){ return natCompare(a.name, b.name); });
    var lettersSeen = [], html = '', lastLetter = null;
    sorted.forEach(function(a){
      var L = firstLetter(a.name);
      if (L !== lastLetter){
        html += '<h2 class="li-letter-heading" id="' + containerId + '-' + L + '">' + L + '</h2>';
        lettersSeen.push(L); lastLetter = L;
      }
      var books = a.books.map(function(b){ return { book: b, displayTitle: stripNumberPrefix(b.title) }; })
                          .sort(function(x,y){ return natCompare(x.displayTitle, y.displayTitle); });
      var itemsHtml = books.map(function(entry){
        return '<li><a href="' + bookHref(entry.book.path) + '">' + esc(entry.displayTitle) + '</a>' +
               bookBadges(entry.book, isNewItem(entry.book.path)) + '</li>';
      }).join('');
      html += '<details class="li-author-node" open>' +
                '<summary><a href="' + authorHref(a.name) + '">' + esc(a.name) + '</a> ' +
                  '<span class="li-author-count">(' + books.length + ')</span></summary>' +
                '<ul class="li-book-list">' + itemsHtml + '</ul>' +
              '</details>';
    });
    if (!sorted.length) html = '<div class="li-empty-note">No authors have items in this view yet.</div>';
    return { html: html, letters: lettersSeen };
  }

  function renderFbundles(){
    var items = DATA.fbundles.map(function(f){ return { f: f, displayTitle: stripNumberPrefix(f.title) }; })
                              .sort(function(x,y){ return natCompare(x.displayTitle, y.displayTitle); });
    var lettersSeen = [], html = '', lastLetter = null;
    items.forEach(function(entry){
      var f = entry.f;
      var L = firstLetter(entry.displayTitle);
      if (L !== lastLetter){
        html += '<h2 class="li-letter-heading" id="fbundles-' + L + '">' + L + '</h2>';
        lettersSeen.push(L); lastLetter = L;
      }
      // Links to the bundle's own node page (same URL catalog_renderer
      // already gives it) rather than guessing the derived _fbundle_web
      // viewer path here a second time -- that node page already renders
      // the correct "View collection" / "Download .zip" buttons via
      // pipeline.catalog_renderer._fbundle_viewer_href(), pairing-gate
      // failures included.
      html += '<div class="li-row">' +
                '<span class="li-row-title"><a href="' + bookHref(f.path) + '">' + esc(entry.displayTitle) + '</a>' +
                  fbundleBadges(isNewItem(f.path)) + '</span>' +
              '</div>';
    });
    if (!items.length) html = '<div class="li-empty-note">No Facebook bundles yet.</div>';
    return { html: html, letters: lettersSeen };
  }

  // Films tab: a flat, alphabetically-sorted list with NO author grouping
  // at all -- "there are no authors" -- same shape as renderFbundles()
  // above rather than the Authors/Books toggle every other tab uses (see
  // render()'s showToolbar, which deliberately excludes 'films' the same
  // way it already excludes 'fbundles'). Unlike fbundles, a film item IS
  // book-shaped (DATA.films entries come from library_index.py's shared
  // _book_entry(), same fields a Library/Galleries/Audiobooks row has), so
  // this uses the full bookBadges() renderer, not fbundleBadges().
  function renderFilms(){
    var items = DATA.films.map(function(f){ return { f: f, displayTitle: stripNumberPrefix(f.title) }; })
                           .sort(function(x,y){ return natCompare(x.displayTitle, y.displayTitle); });
    var lettersSeen = [], html = '', lastLetter = null;
    items.forEach(function(entry){
      var f = entry.f;
      var L = firstLetter(entry.displayTitle);
      if (L !== lastLetter){
        html += '<h2 class="li-letter-heading" id="films-' + L + '">' + L + '</h2>';
        lettersSeen.push(L); lastLetter = L;
      }
      html += '<div class="li-row">' +
                '<span class="li-row-title"><a href="' + bookHref(f.path) + '">' + esc(entry.displayTitle) + '</a>' +
                  bookBadges(f, isNewItem(f.path)) + '</span>' +
              '</div>';
    });
    if (!items.length) html = '<div class="li-empty-note">No films yet.</div>';
    return { html: html, letters: lettersSeen };
  }

  var state = { tab: 'library', mode: 'authors' };

  function currentAuthorsForTab(tab){
    if (tab === 'library') return DATA.authors;
    if (tab === 'galleries'){
      return DATA.authors
        .map(function(a){ return { name: a.name, books: a.books.filter(function(b){ return b.isGallery; }) }; })
        .filter(function(a){ return a.books.length > 0; });
    }
    if (tab === 'audiobooks'){
      return DATA.authors
        .map(function(a){ return { name: a.name, books: a.books.filter(function(b){ return b.isAudiobook; }) }; })
        .filter(function(a){ return a.books.length > 0; });
    }
    if (tab === 'readonline'){
      return DATA.authors
        .map(function(a){ return { name: a.name, books: a.books.filter(function(b){ return b.isReadOnline; }) }; })
        .filter(function(a){ return a.books.length > 0; });
    }
    return [];
  }

  function render(){
    var tab = state.tab;
    document.querySelectorAll('.li-tab').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    document.querySelectorAll('.li-view').forEach(function(v){ v.classList.remove('active'); });
    document.getElementById('liView-' + tab).classList.add('active');

    var showToolbar = (tab === 'library' || tab === 'galleries' || tab === 'audiobooks' || tab === 'readonline');
    document.getElementById('liToolbar').style.display = showToolbar ? '' : 'none';
    document.getElementById('liTreeActions').style.display = (showToolbar && state.mode === 'authors') ? '' : 'none';

    if (showToolbar){
      var scopedAuthors = currentAuthorsForTab(tab);
      var scopedBookCount = scopedAuthors.reduce(function(sum, a){ return sum + a.books.length; }, 0);
      document.getElementById('liModeAuthorsBtn').textContent = 'Authors (' + scopedAuthors.length + ')';
      document.getElementById('liModeBooksBtn').textContent = 'Books (' + scopedBookCount + ')';
    }

    var result;
    if (tab === 'fbundles'){
      result = renderFbundles();
      document.getElementById('liView-fbundles').innerHTML = result.html;
    } else if (tab === 'films'){
      result = renderFilms();
      document.getElementById('liView-films').innerHTML = result.html;
    } else {
      var authors = currentAuthorsForTab(tab);
      result = state.mode === 'authors' ? renderAuthorsTree(authors, tab) : renderBooksFlat(authors, tab);
      document.getElementById('liView-' + tab).innerHTML = result.html;
    }
    document.getElementById('liAlphaIndexInner').innerHTML = buildAlphaIndex(result.letters, tab);
  }

  document.querySelectorAll('.li-tab').forEach(function(btn){
    btn.addEventListener('click', function(){ state.tab = btn.dataset.tab; render(); });
  });

  function updateModeButtons(){
    document.getElementById('liModeAuthorsBtn').setAttribute('aria-pressed', state.mode === 'authors');
    document.getElementById('liModeBooksBtn').setAttribute('aria-pressed', state.mode === 'books');
  }
  document.getElementById('liModeAuthorsBtn').addEventListener('click', function(){ state.mode = 'authors'; updateModeButtons(); render(); });
  document.getElementById('liModeBooksBtn').addEventListener('click', function(){ state.mode = 'books'; updateModeButtons(); render(); });

  document.getElementById('liExpandAllBtn').addEventListener('click', function(){
    document.querySelectorAll('.li-view.active details.li-author-node').forEach(function(d){ d.open = true; });
  });
  document.getElementById('liCollapseAllBtn').addEventListener('click', function(){
    document.querySelectorAll('.li-view.active details.li-author-node').forEach(function(d){ d.open = false; });
  });

  var backBtn = document.getElementById('liBackTop');
  window.addEventListener('scroll', function(){
    backBtn.classList.toggle('show', window.scrollY > 480);
  }, { passive: true });
  backBtn.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });

  // Delegated -- the alpha index bar's contents are replaced on every
  // render(), so a static listener attached once here survives that.
  document.getElementById('liAlphaIndex').addEventListener('click', function(e){
    var t = e.target.closest('[data-jump-top]');
    if (!t) return;
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  fetch(DATA_URL).then(function(r){ return r.json(); }).then(function(data){
    DATA = data;
    NEWEST_SET = {};
    (data.newestPaths || []).forEach(function(p){ NEWEST_SET[p] = true; });

    document.getElementById('liStats').innerHTML =
      '<span>Last updated: <b>' + esc(data.lastUpdated) + '</b></span>' +
      '<span><b>' + data.totalBooks + '</b> total book pages</span>' +
      '<span><b>' + data.totalAuthors + '</b> authors</span>';
      // Facebook bundle count removed from this top stats line by request --
      // still tracked in data.totalFbundles and shown on the "Facebook
      // Bundles" tab button itself (liCountFbundles) below.

    document.getElementById('liCountLibrary').textContent = '(' + data.totalBooks + ')';
    document.getElementById('liCountGalleries').textContent = '(' + data.totalGalleries + ')';
    document.getElementById('liCountAudiobooks').textContent = '(' + data.totalAudiobooks + ')';
    document.getElementById('liCountFilms').textContent = '(' + data.totalFilms + ')';
    document.getElementById('liCountReadOnline').textContent = '(' + data.totalReadOnline + ')';
    document.getElementById('liCountFbundles').textContent = '(' + data.totalFbundles + ')';

    // Deep-link from a badge (pipeline.badges' library_anchor_url(), e.g.
    // "/library/#audiobooks" or "/library/#films") -- simpler than
    // pipeline.home's own activateFromHash(): render() above already keys
    // entirely off state.tab, so all that's needed is seeding it from the
    // hash before the first render() call below, no separate "activate a
    // panel, then scroll to it" step. Only a known tab id is honored --
    // an unrelated/stray hash leaves the default 'library' tab in place.
    var hashTab = (window.location.hash || '').replace(/^#/, '');
    if (['library', 'galleries', 'audiobooks', 'films', 'readonline', 'fbundles'].indexOf(hashTab) !== -1){
      state.tab = hashTab;
    }

    updateModeButtons();
    render();
  }).catch(function(err){
    document.getElementById('liView-library').innerHTML =
      '<div class="li-empty-note">Could not load the library index data (' + esc(err && err.message) + ').</div>';
  });
})();
</script>
</div>

<script>
(function() {
  var MAX_RETRIES = 2;            // up to 3 attempts total per click
  var RETRY_BASE_DELAY_MS = 400;  // doubles each retry, plus jitter
  var CHECK_TIMEOUT_MS = 4000;    // give up on one attempt after this
  var INDICATOR_DELAY_MS = 220;   // only show "checking" if it's not instant

  function isEligible(a, e) {
    if (!a || !a.getAttribute("href")) return false;
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return false;
    var target = a.getAttribute("target");
    if (target && target !== "_self") return false;
    if (a.hasAttribute("download")) return false;
    var url;
    try { url = new URL(a.href, window.location.href); } catch (err) { return false; }
    if (url.protocol !== "http:" && url.protocol !== "https:") return false;
    if (url.origin !== window.location.origin) return false;
    // Fragment-only link on the current document -- nothing to verify.
    if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return false;
    return true;
  }

  function checkOnce(url) {
    var hasAbort = "AbortController" in window;
    var controller = hasAbort ? new AbortController() : null;
    var timer = controller ? setTimeout(function() { controller.abort(); }, CHECK_TIMEOUT_MS) : null;
    return fetch(url, {
      method: "HEAD",
      cache: "no-store",
      signal: controller ? controller.signal : undefined
    }).then(function(resp) {
      if (timer) clearTimeout(timer);
      return resp;
    }, function(err) {
      if (timer) clearTimeout(timer);
      throw err;
    });
  }

  function verify(url, attemptNum) {
    return checkOnce(url).then(function(resp) {
      // A real 404 means the page genuinely isn't there right now --
      // retrying won't change that, so stop and let it through as-is
      // rather than delaying an accurate result.
      if (resp.status === 404) return true;
      if (!resp.ok && attemptNum < MAX_RETRIES) return retryAfterDelay(url, attemptNum);
      return true;
    }).catch(function() {
      // Network error / timeout / aborted request -- exactly the
      // transient-hiccup case this exists for. Worth a retry.
      if (attemptNum < MAX_RETRIES) return retryAfterDelay(url, attemptNum);
      return true;
    });
  }

  function retryAfterDelay(url, attemptNum) {
    var delay = RETRY_BASE_DELAY_MS * Math.pow(2, attemptNum) + Math.random() * 150;
    return new Promise(function(resolve) {
      setTimeout(function() { resolve(verify(url, attemptNum + 1)); }, delay);
    });
  }

  var indicatorTimer = null;
  var indicatorEl = null;

  function ensureIndicatorStyle() {
    if (document.getElementById("nav-reliability-style")) return;
    var style = document.createElement("style");
    style.id = "nav-reliability-style";
    style.textContent =
      "@keyframes nav-reliability-sweep{0%{background-position:200% 0}100%{background-position:-200% 0}}" +
      "#nav-reliability-bar{position:fixed;top:0;left:0;height:3px;width:100%;z-index:99999;" +
      "background:linear-gradient(90deg,transparent,#9C6B2E,transparent);background-size:200% 100%;" +
      "animation:nav-reliability-sweep 1s linear infinite;opacity:0.7;pointer-events:none;}";
    document.head.appendChild(style);
  }

  function showIndicator() {
    if (indicatorEl) return;
    ensureIndicatorStyle();
    indicatorEl = document.createElement("div");
    indicatorEl.id = "nav-reliability-bar";
    indicatorEl.setAttribute("aria-hidden", "true");
    document.body.appendChild(indicatorEl);
  }

  function hideIndicator() {
    if (indicatorTimer) { clearTimeout(indicatorTimer); indicatorTimer = null; }
    if (indicatorEl) { indicatorEl.remove(); indicatorEl = null; }
  }

  document.addEventListener("click", function(e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!isEligible(a, e)) return;

    e.preventDefault();
    var href = a.href;
    indicatorTimer = setTimeout(showIndicator, INDICATOR_DELAY_MS);

    verify(href, 0).then(function() {
      hideIndicator();
      window.location.href = href;
    }).catch(function() {
      // Nothing above should reject, but never leave a click doing
      // nothing -- fall through to a normal navigation regardless.
      hideIndicator();
      window.location.href = href;
    });
  }, true);
})();

(function() {
  var INDEX_URL = '/The-Home-Scholar-Library/assets/search-index.json';
  var indexPromise = null;

  function loadIndex() {
    if (!indexPromise) {
      indexPromise = fetch(INDEX_URL)
        .then(function(r) { return r.ok ? r.json() : []; })
        .catch(function() { return []; });
    }
    return indexPromise;
  }

  function render(results, matches) {
    results.innerHTML = "";
    if (!matches.length) {
      var empty = document.createElement("div");
      empty.className = "site-search-empty";
      empty.textContent = "No matches";
      results.appendChild(empty);
      return;
    }
    matches.slice(0, 20).forEach(function(item) {
      var a = document.createElement("a");
      a.className = "site-search-result";
      a.href = item.url;
      var title = document.createElement("span");
      title.textContent = item.title;
      var path = document.createElement("span");
      path.className = "site-search-result-path";
      path.textContent = item.path || "";
      a.appendChild(title);
      a.appendChild(path);
      results.appendChild(a);
    });
  }

  document.querySelectorAll(".site-search").forEach(function(wrap) {
    var input = wrap.querySelector(".site-search-input");
    var results = wrap.querySelector(".site-search-results");
    if (!input || !results) return;

    input.addEventListener("input", function() {
      var query = input.value.trim().toLowerCase();
      if (!query) { results.innerHTML = ""; return; }
      loadIndex().then(function(idx) {
        var matches = idx.filter(function(item) {
          return item.title.toLowerCase().indexOf(query) !== -1;
        });
        render(results, matches);
      });
    });

    document.addEventListener("click", function(e) {
      if (!wrap.contains(e.target)) results.innerHTML = "";
    });
  });
})();
</script>
