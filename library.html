<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catalog - Home Scholar Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  /* font-family reads the shared --site-font custom property -- see
     catalog_renderer.py's identical rule/comment for the full
     reasoning; both templates read the same one config knob. */
  body { font-family: var(--site-font, system-ui, sans-serif); max-width: 46rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #222; }
  h1, h2, h3 { line-height: 1.25; }
  img { max-width: 100%; }
  pre { background: #f4f4f4; padding: 0.75rem; overflow-x: auto; }
  code { background: #f4f4f4; padding: 0.1rem 0.3rem; }
</style>
<style>
  :root { --site-font: 'EB Garamond', Georgia, serif; }
  .site-nav { display: flex; align-items: center; gap: 18px; padding: 10px 0 16px; font-family: var(--site-font); flex-wrap: wrap; }
  .site-nav-home { color: #1a5fb4; text-decoration: none; font-size: 0.85rem; font-weight: 600; flex: 0 0 auto; white-space: nowrap; }
  .site-nav-home:hover { text-decoration: underline; }
  .site-pages-nav { display: flex; align-items: center; gap: 14px; flex: 0 1 auto; flex-wrap: wrap; }
  .site-pages-nav a { color: #444; text-decoration: none; font-size: 0.85rem; white-space: nowrap; }
  .site-pages-nav a:hover { color: #1a5fb4; text-decoration: underline; }
  .site-search { position: relative; flex: 1 1 auto; max-width: 360px; margin-left: auto; }
  .site-search input { width: 100%; box-sizing: border-box; padding: 6px 10px; font-size: 0.85rem;
                        border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
  .site-search-results { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #fff;
                          border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.12);
                          max-height: 320px; overflow-y: auto; z-index: 50; }
  .site-search-results:empty { display: none; }
  .site-search-result { display: block; padding: 7px 10px; font-size: 0.85rem; color: #222; text-decoration: none; border-bottom: 1px solid #f0f0f0; }
  .site-search-result:last-child { border-bottom: none; }
  .site-search-result:hover { background: #f4f6fa; }
  .site-search-result-path { display: block; font-size: 0.72rem; color: #888; margin-top: 1px; }
  .site-search-empty { padding: 8px 10px; font-size: 0.8rem; color: #888; }
</style>
</head>
<body>
<div class="site-nav"><a class="site-nav-home" href="/">&#9738; Home</a><nav class="site-pages-nav"><a href="/library/">Browse Library</a><a href="/about Home Scholar Library.html">About</a><a href="/about.html">About</a><a href="/contact.html">Contact</a><a href="/ebook_collections.html">Ebook Collections</a><a href="/faq.html">FAQ</a><a href="/reading-guide.html">Reading Guide</a></nav><div class="site-search"><input type="search" class="site-search-input" placeholder="Search the library&hellip;" aria-label="Search the library" autocomplete="off"><div class="site-search-results" role="listbox"></div></div></div>
<article>
<p>This page has moved. Redirecting to <a href="/library/">Browse Library</a>&hellip;</p><script>location.replace("/library/");</script>
</article>
<script>
(function() {
  var INDEX_URL = '/assets/search-index.json';
  var indexPromise = null;

  function loadIndex() {
    if (!indexPromise) {
      indexPromise = fetch(INDEX_URL)
        .then(function(r) { return r.ok ? r.json() : []; })
        .catch(function() { return []; });
    }
    return indexPromise;
  }

  function render(results, matches) {
    results.innerHTML = "";
    if (!matches.length) {
      var empty = document.createElement("div");
      empty.className = "site-search-empty";
      empty.textContent = "No matches";
      results.appendChild(empty);
      return;
    }
    matches.slice(0, 20).forEach(function(item) {
      var a = document.createElement("a");
      a.className = "site-search-result";
      a.href = item.url;
      var title = document.createElement("span");
      title.textContent = item.title;
      var path = document.createElement("span");
      path.className = "site-search-result-path";
      path.textContent = item.path || "";
      a.appendChild(title);
      a.appendChild(path);
      results.appendChild(a);
    });
  }

  document.querySelectorAll(".site-search").forEach(function(wrap) {
    var input = wrap.querySelector(".site-search-input");
    var results = wrap.querySelector(".site-search-results");
    if (!input || !results) return;

    input.addEventListener("input", function() {
      var query = input.value.trim().toLowerCase();
      if (!query) { results.innerHTML = ""; return; }
      loadIndex().then(function(idx) {
        var matches = idx.filter(function(item) {
          return item.title.toLowerCase().indexOf(query) !== -1;
        });
        render(results, matches);
      });
    });

    document.addEventListener("click", function(e) {
      if (!wrap.contains(e.target)) results.innerHTML = "";
    });
  });
})();
</script>
</body>
</html>
